<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>PELAYANAN LALU-LINTAS REPORT</title><style>
html,body{margin:0;padding:0;width:100%;height:100dvh;overflow:hidden;background:#000;font-family:sans-serif}
#app-header{position:fixed;top:0;left:0;right:0;height:54px;background:rgba(13,42,84,0.92);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.4);transition:transform .4s ease}
#app-header.hide{transform:translateY(-102%)}
#app-header img{height:36px;width:auto;background:#fff;border-radius:6px;padding:3px 6px;object-fit:contain}
#app-header .title{display:flex;flex-direction:column;line-height:1.1} #app-header .title b{font-size:13px} #app-header .title small{font-size:10px;opacity:.85}
#frame-wrapper{position:fixed;top:54px;left:0;width:100vw;height:calc(100dvh - 54px);overflow:hidden;background:#fff;transition:all .4s ease;z-index:10}
#frame-wrapper.full{top:0;height:100dvh}
#frame-wrapper iframe{position:absolute;top:-40px;left:0;width:100%;height:calc(100% + 40px);border:none}
#show-btn{position:fixed;top:10px;right:10px;z-index:31;width:38px;height:38px;border-radius:50%;border:none;background:rgba(13,42,84,.9);color:#fff;display:none;cursor:pointer}
#show-btn.show{display:grid;place-items:center}
#splash{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center;transition:opacity .6s ease, visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{height:70px;background:#fff;border-radius:10px;padding:8px 14px;margin-bottom:18px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
#splash h1{font-size:20px;margin:0 0 6px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#splash p{font-size:12px;opacity:.9;margin:0 0 20px}
.loader{width:36px;height:36px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
